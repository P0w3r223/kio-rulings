odstepstwa:
  - cecha: dlugosc_tresci
    powod: >-
      Korpus ma medianę 11 416 znaków i maksimum 355 527 (pomiar 5); pokaz generuje uzasadnienia
      rzędu kilku tysięcy znaków, bo pokaz ma przejść w minutę, a długość nie zmienia ścieżki.
  - cecha: rozjazd_daty_rozprawy
    powod: >-
      9 z 295 rekordów ma datę wydania wcześniejszą niż rozprawy (Jakość pól Atlasu); pokaz tego
      nie odwzorowuje — żaden krok ścieżki operatora od tego nie zależy.
